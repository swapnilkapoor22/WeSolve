openapi: 3.0.3
info:
  title: WeSolve API
  version: 1.0.0
  description: >-
    REST contract for the WeSolve single page application. Source of truth for backend contract
    tests and the generated frontend client. All paths except /public-config require a bearer token.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: Session
  - name: Tickets
  - name: Dashboard
  - name: Assistant
  - name: Users
  - name: Access
paths:
  /api/v1/public-config:
    get:
      tags: [Session]
      summary: Sign-in settings for the browser app
      security: []
      operationId: getPublicConfig
      responses:
        '200':
          description: Public configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }
  /api/v1/me:
    get:
      tags: [Session]
      summary: Signed-in member and the actions they hold
      operationId: getMe
      responses:
        '200':
          description: Current member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentMember' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/assignees:
    get:
      tags: [Tickets]
      summary: People who can be assigned tickets
      description: Requires TICKET_CREATE or TICKET_UPDATE.
      operationId: listAssignees
      responses:
        '200':
          description: Assignable members by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/tickets:
    get:
      tags: [Tickets]
      summary: Queue and search
      description: Requires TICKET_VIEW. A non-empty q additionally requires TICKET_SEARCH. Newest first.
      operationId: listTickets
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Tickets]
      summary: Create a ticket
      description: Requires TICKET_CREATE. The ticket starts OPEN.
      operationId: createTicket
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTicketRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/tickets/{number}:
    parameters:
      - { $ref: '#/components/parameters/TicketNumber' }
    get:
      tags: [Tickets]
      summary: Ticket detail
      description: Requires TICKET_VIEW.
      operationId: getTicket
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Tickets]
      summary: Change fields, assignee, or status in one save
      description: >-
        Title, description, priority and assignee need TICKET_UPDATE. Status needs TICKET_STATUS.
        A comment needs TICKET_COMMENT unless the same request changes status. Resolved and
        Cancelled require a non-blank comment. One request writes at most one history entry.
        Omitted fields are unchanged. Setting a field to its stored value is not a change.
      operationId: updateTicket
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTicketRequest' }
      responses:
        '200':
          description: Updated ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Status change not allowed from the stored status
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/v1/tickets/{number}/comments:
    parameters:
      - { $ref: '#/components/parameters/TicketNumber' }
    post:
      tags: [Tickets]
      summary: Add a free comment
      description: Requires TICKET_COMMENT. Allowed on Closed and Cancelled tickets. Does not change status or assignee.
      operationId: addComment
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCommentRequest' }
      responses:
        '201':
          description: History entry holding the comment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/tickets/{number}/history:
    parameters:
      - { $ref: '#/components/parameters/TicketNumber' }
    get:
      tags: [Tickets]
      summary: History, oldest first
      description: Requires TICKET_VIEW. Entries with a comment are the ticket's comments.
      operationId: listHistory
      parameters:
        - { name: afterId, in: query, schema: { type: integer, format: int64, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Entries after afterId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryPage' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /api/v1/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Counts of the signed-in member's assigned tickets by status
      operationId: getDashboardSummary
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
  /api/v1/dashboard/tickets:
    get:
      tags: [Dashboard]
      summary: Tickets assigned to the signed-in member
      description: Does not require TICKET_VIEW. Newest first.
      operationId: listMyTickets
      parameters:
        - { $ref: '#/components/parameters/Status' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
  /api/v1/assistant/questions:
    post:
      tags: [Assistant]
      summary: Ask a question about past tickets
      description: Requires TICKET_ASSISTANT. 503 when the assistant provider is not configured or unavailable.
      operationId: askAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantQuestion' }
      responses:
        '200':
          description: Answer, disagreement, or no support
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantAnswer' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /api/v1/users:
    get:
      tags: [Users]
      summary: List people
      description: Requires USER_MANAGE or ACCESS_MANAGE.
      operationId: listUsers
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Users]
      summary: Add a person
      description: Requires USER_MANAGE. Starts active and in no group.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/users/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Users]
      summary: One person
      operationId: getUser
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Users]
      summary: Change name, email, active, assignable, or groups
      description: >-
        Requires USER_MANAGE. The sign-in id cannot be changed. Refused with 409 when the change
        would leave no active holder of ACCESS_MANAGE.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/access-types:
    get:
      tags: [Access]
      summary: The nine fixed actions
      description: Requires USER_MANAGE or ACCESS_MANAGE.
      operationId: listAccessTypes
      responses:
        '200':
          description: Actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AccessType' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/v1/groups:
    get:
      tags: [Access]
      summary: List groups
      description: Read needs USER_MANAGE or ACCESS_MANAGE.
      operationId: listGroups
      responses:
        '200':
          description: Groups with their roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Group' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Access]
      summary: Add a group
      description: Requires ACCESS_MANAGE.
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/groups/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Access]
      summary: Rename, mark inactive, or set the roles of a group
      description: Requires ACCESS_MANAGE. 409 when it would leave no active holder of ACCESS_MANAGE.
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupUpdate' }
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/roles:
    get:
      tags: [Access]
      summary: List roles
      description: Read needs USER_MANAGE or ACCESS_MANAGE.
      operationId: listRoles
      responses:
        '200':
          description: Roles with their actions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Access]
      summary: Add a role
      description: Requires ACCESS_MANAGE.
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /api/v1/roles/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    patch:
      tags: [Access]
      summary: Rename a role or set its actions
      description: Requires ACCESS_MANAGE. 409 when it would leave no active holder of ACCESS_MANAGE.
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleUpdate' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TicketNumber:
      name: number
      in: path
      required: true
      description: Numeric part of TKT-<number>
      schema: { type: integer, format: int64, minimum: 1 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Status:
      name: status
      in: query
      description: Omit for all statuses
      schema: { $ref: '#/components/schemas/Status' }
    Page:
      name: page
      in: query
      description: Zero-based
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 8, maxLength: 100 }
  responses:
    Problem:
      description: Problem details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: >-
            Stable error code, e.g. VALIDATION_FAILED, NOT_FOUND, NO_ACCESS, FORBIDDEN,
            STATUS_CHANGE_NOT_ALLOWED, COMMENT_REQUIRED, LAST_ADMIN, DUPLICATE, IDEMPOTENCY_CONFLICT,
            ASSISTANT_UNAVAILABLE.
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    PublicConfig:
      type: object
      required: [issuer, clientId]
      properties:
        issuer: { type: string }
        clientId: { type: string }
    Status:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED, CANCELLED]
    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
    ActionCode:
      type: string
      enum:
        - TICKET_CREATE
        - TICKET_VIEW
        - TICKET_UPDATE
        - TICKET_STATUS
        - TICKET_COMMENT
        - TICKET_SEARCH
        - TICKET_ASSISTANT
        - USER_MANAGE
        - ACCESS_MANAGE
    Member:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
    CurrentMember:
      type: object
      required: [id, displayName, actions]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionCode' }
    TicketSummary:
      type: object
      required: [number, title, priority, status, assignee, createdAt]
      properties:
        number: { type: integer, format: int64 }
        title: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        status: { $ref: '#/components/schemas/Status' }
        assignee: { $ref: '#/components/schemas/Member' }
        createdAt: { type: string, format: date-time }
    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketSummary'
        - type: object
          required: [description, updatedAt]
          properties:
            description: { type: string }
            updatedAt: { type: string, format: date-time }
    TicketPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TicketSummary' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    CreateTicketRequest:
      type: object
      required: [title, description, priority, assigneeId]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: string, format: uuid }
    UpdateTicketRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/Status' }
        comment: { type: string, minLength: 1, maxLength: 2000 }
    AddCommentRequest:
      type: object
      required: [comment]
      additionalProperties: false
      properties:
        comment: { type: string, minLength: 1, maxLength: 2000 }
    HistoryEntry:
      type: object
      required: [id, actor, createdAt]
      properties:
        id: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/Member' }
        createdAt: { type: string, format: date-time }
        fromStatus: { $ref: '#/components/schemas/Status' }
        toStatus: { $ref: '#/components/schemas/Status' }
        fromAssignee: { $ref: '#/components/schemas/Member' }
        toAssignee: { $ref: '#/components/schemas/Member' }
        comment: { type: string }
    HistoryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }
        hasMore: { type: boolean }
    DashboardSummary:
      type: object
      required: [all, open, inProgress, resolved, closed, cancelled]
      properties:
        all: { type: integer, format: int64 }
        open: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        resolved: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }
    AssistantQuestion:
      type: object
      required: [question]
      additionalProperties: false
      properties:
        question: { type: string, minLength: 1, maxLength: 1000 }
    AssistantReference:
      type: object
      required: [ticketNumber, title]
      properties:
        ticketNumber: { type: integer, format: int64 }
        title: { type: string }
    AssistantAnswer:
      type: object
      required: [outcome, references]
      properties:
        outcome:
          type: string
          enum: [ANSWERED, CONFLICT, NO_SUPPORT]
        answer:
          type: string
          description: Absent when the outcome is NO_SUPPORT
        references:
          type: array
          description: Empty when the outcome is NO_SUPPORT
          items: { $ref: '#/components/schemas/AssistantReference' }
    User:
      type: object
      required: [id, signInId, displayName, email, active, canBeAssigned, groupIds]
      properties:
        id: { type: string, format: uuid }
        signInId: { type: string }
        displayName: { type: string }
        email: { type: string }
        active: { type: boolean }
        canBeAssigned: { type: boolean }
        groupIds:
          type: array
          items: { type: string, format: uuid }
    UserPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer, format: int64 }
        totalPages: { type: integer }
    CreateUserRequest:
      type: object
      required: [signInId, displayName, email]
      additionalProperties: false
      properties:
        signInId: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        canBeAssigned: { type: boolean, default: true }
        groupIds:
          type: array
          items: { type: string, format: uuid }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        active: { type: boolean }
        canBeAssigned: { type: boolean }
        groupIds:
          type: array
          items: { type: string, format: uuid }
    AccessType:
      type: object
      required: [code, description]
      properties:
        code: { $ref: '#/components/schemas/ActionCode' }
        description: { type: string }
    Group:
      type: object
      required: [id, name, active, memberCount, roleIds]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        memberCount: { type: integer }
        roleIds:
          type: array
          items: { type: string, format: uuid }
    GroupWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        roleIds:
          type: array
          items: { type: string, format: uuid }
    GroupUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        active: { type: boolean }
        roleIds:
          type: array
          items: { type: string, format: uuid }
    Role:
      type: object
      required: [id, name, actions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionCode' }
    RoleWrite:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionCode' }
    RoleUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        actions:
          type: array
          items: { $ref: '#/components/schemas/ActionCode' }
